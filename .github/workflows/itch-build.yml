# Builds the itch.io upload (index.html, art/, src/ at the top of the zip) and
# publishes it on the "itch-latest" release every time main changes.
# Download: https://github.com/kitobrito/Shattered-Realms-TCG/releases/download/itch-latest/shattered-realms-itch.zip
# With the BUTLER_API_KEY secret and ITCH_GAME variable set, it also pushes the game to itch.io
# (channel "html5") with butler, which uploads only the files that changed.
name: itch build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# One run at a time: itch.io takes a new build only after the last one has processed.
concurrency:
  group: itch-push-html5
  cancel-in-progress: false
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the game (card art as WebP, bundled into packs)
        run: |
          pip install --quiet pillow
          python3 tools/build-dist.py dist
      - name: Zip the game
        # itch.io refuses zips with more than 1000 entries; the art packs keep us far under
        # that, and -D leaves out folder entries.
        run: |
          (cd dist && zip -qrD ../shattered-realms-itch.zip .)
          n=$(unzip -Z1 shattered-realms-itch.zip | wc -l)
          echo "Files in zip: $n"
          if [ "$n" -gt 1000 ]; then echo "::error::itch.io allows at most 1000 files; this zip has $n"; exit 1; fi
      - name: Publish to the itch-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete itch-latest --yes --cleanup-tag || true
          gh release create itch-latest shattered-realms-itch.zip \
            --title "itch.io build (latest)" \
            --notes "Ready to upload to itch.io: index.html, art and src are at the top of the zip. Rebuilt automatically from main ($GITHUB_SHA)." \
            --target "$GITHUB_SHA"
      - name: Push to itch.io with butler (html5)
        # Sends only what changed since the last upload. Turns on once the repo has
        # the BUTLER_API_KEY secret (the page is fadeawaytoday/shattered-realms-tcg unless the ITCH_GAME variable says otherwise);
        # until then this step just says so and the build still succeeds.
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME || 'fadeawaytoday/shattered-realms-tcg' }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice::itch.io publishing is off: add the BUTLER_API_KEY secret and the ITCH_GAME variable to turn it on."
            echo "BUTLER_API_KEY is missing from the repository's Actions secrets, so nothing was pushed." > butler-report.txt
            gh release upload itch-latest butler-report.txt --clobber
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o butler.zip -d butler-bin && chmod +x butler-bin/butler
          mkdir -p itch-dir && unzip -q -o shattered-realms-itch.zip -d itch-dir
          # Keep butler's report (no secrets in it) on the release, so problems can be read without the Actions logs.
          {
            echo "target: $ITCH_GAME:html5"
            ./butler-bin/butler -V 2>&1 || true
            # itch.io refuses a new build while the previous one is still processing: wait and retry (up to ~25 min).
            for try in $(seq 1 25); do
              rc=0; out=$(./butler-bin/butler push itch-dir "$ITCH_GAME:html5" --userversion "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" 2>&1) || rc=$?
              echo "$out"
              if [ "$rc" = 0 ] || ! grep -q "still processing" <<<"$out"; then break; fi
              echo "itch.io is still processing the previous build; trying again in 60 s ($try/25)"
              sleep 60
            done
            echo "push exit code: $rc"
            ./butler-bin/butler status "$ITCH_GAME" 2>&1 || true
          } | tee butler-report.txt
          gh release upload itch-latest butler-report.txt --clobber
          grep -q "push exit code: 0" butler-report.txt
