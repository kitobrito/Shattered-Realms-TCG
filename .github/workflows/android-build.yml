# Builds an installable Android APK (offline play) from the web game and
# publishes it on the "android-latest" release every time main changes.
# Download: https://github.com/kitobrito/Shattered-Realms-TCG/releases/download/android-latest/shattered-realms.apk
# It is signed with tools/android/debug.keystore (a test key, not for the Play Store),
# so each new APK installs as an update over the last one.
# With the BUTLER_API_KEY secret and ITCH_GAME variable set, it is also pushed to itch.io (channel "android").
name: android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
# One run at a time: itch.io takes a new build only after the last one has processed.
concurrency:
  group: itch-push-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the game into a Capacitor web folder (card art as WebP, bundled into packs)
        run: |
          pip install --quiet pillow
          python3 tools/build-dist.py build/www
          mkdir -p build/assets && cp art/app/icon-1024.png build/assets/icon-only.png
      - name: Create the Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/assets@3.0.5 @capacitor/app@6.0.2
          npx cap init "Shattered Realms" com.kitobrito.shatteredrealms --web-dir www
          # Feel like a game, not a web page: dark launch, full screen, Back button, haptics (tools/android/setup-native.py).
          python3 ../tools/android/setup-native.py config
          npx cap add android
          python3 ../tools/android/setup-native.py native
          python3 ../tools/android/setup-native.py splash
          npx capacitor-assets generate --android --iconBackgroundColor '#0d0a1a' --iconBackgroundColorDark '#0d0a1a' --splashBackgroundColor '#0c0806' --splashBackgroundColorDark '#0c0806'
          npx cap sync android
      - name: Build the APK
        working-directory: build/android
        # Keep the build log; if the build fails it is attached to the android-latest release.
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee ../../android-build-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Attach the build log if the APK failed to build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-latest android-build-log.txt --clobber || true
      - name: Sign with the project's fixed test key (so updates install over old builds)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 build/android/app/build/outputs/apk/debug/app-debug.apk shattered-realms.apk
          "$BT/apksigner" sign --ks tools/android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey shattered-realms.apk
          "$BT/apksigner" verify --print-certs shattered-realms.apk | head -3
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest shattered-realms.apk \
            --title "Android APK (latest, for testing)" \
            --notes "Install on an Android phone for testing (allow installs from unknown sources). Offline play. Rebuilt automatically from main ($GITHUB_SHA)." \
            --target "$GITHUB_SHA"
      - name: Push to itch.io with butler (android)
        # Sends only what changed since the last upload. Turns on once the repo has
        # the BUTLER_API_KEY secret (the page is fadeawaytoday/shattered-realms-tcg unless the ITCH_GAME variable says otherwise);
        # until then this step just says so and the build still succeeds.
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME || 'fadeawaytoday/shattered-realms-tcg' }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice::itch.io publishing is off: add the BUTLER_API_KEY secret and the ITCH_GAME variable to turn it on."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o butler.zip -d butler-bin && chmod +x butler-bin/butler
          # itch.io refuses a new build while the previous one is still processing: wait and retry (up to ~25 min).
          for try in $(seq 1 25); do
            rc=0; out=$(./butler-bin/butler push shattered-realms.apk "$ITCH_GAME:android" --userversion "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" 2>&1) || rc=$?
            echo "$out"
            if [ "$rc" = 0 ] || ! grep -q "still processing" <<<"$out"; then break; fi
            echo "itch.io is still processing the previous build; trying again in 60 s ($try/25)"
            sleep 60
          done
          exit "$rc"
