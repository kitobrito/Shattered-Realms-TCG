# Builds an installable Android APK (offline play) from the web game and
# publishes it on the "android-latest" release every time main changes.
# Download: https://github.com/kitobrito/Shattered-Realms-TCG/releases/download/android-latest/shattered-realms.apk
# It is signed with tools/android/debug.keystore (a test key, not for the Play Store),
# so each new APK installs as an update over the last one.
# With the BUTLER_API_KEY secret and ITCH_GAME variable set, it is also pushed to itch.io (channel "android").
name: android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copy the game into a Capacitor web folder
        run: mkdir -p build/www build/assets && cp -r index.html art src build/www/ && cp art/app/icon-1024.png build/assets/icon-only.png
      - name: Create the Android project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/assets@3.0.5
          npx cap init "Shattered Realms" com.kitobrito.shatteredrealms --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0d0a1a' --iconBackgroundColorDark '#0d0a1a'
          npx cap sync android
      - name: Build the APK
        working-directory: build/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Sign with the project's fixed test key (so updates install over old builds)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 build/android/app/build/outputs/apk/debug/app-debug.apk shattered-realms.apk
          "$BT/apksigner" sign --ks tools/android/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey shattered-realms.apk
          "$BT/apksigner" verify --print-certs shattered-realms.apk | head -3
      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest shattered-realms.apk \
            --title "Android APK (latest, for testing)" \
            --notes "Install on an Android phone for testing (allow installs from unknown sources). Offline play. Rebuilt automatically from main ($GITHUB_SHA)." \
            --target "$GITHUB_SHA"
      - name: Push to itch.io with butler (android)
        # Sends only what changed since the last upload. Turns on once the repo has
        # the BUTLER_API_KEY secret and the ITCH_GAME variable (e.g. yourname/shattered-realms);
        # until then this step just says so and the build still succeeds.
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice::itch.io publishing is off: add the BUTLER_API_KEY secret and the ITCH_GAME variable to turn it on."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o butler.zip -d butler-bin && chmod +x butler-bin/butler
          ./butler-bin/butler push shattered-realms.apk "$ITCH_GAME:android" --userversion "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
