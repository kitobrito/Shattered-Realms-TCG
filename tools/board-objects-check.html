<!doctype html>
<!-- Used by tools/verify-board-objects.mjs: one board's moving objects over its painting, at the painting's own size. -->
<meta charset="utf-8">
<base href="../">
<style>body { margin: 0; background: #000; } #stage { position: relative; } #stage img, #stage canvas { position: absolute; left: 0; top: 0; }</style>
<div id="stage"><img id="paint" alt=""><div id="host" style="position:absolute;inset:0"></div></div>
<script type="module">
import { startBoardFx, CIRCLE_SIZE } from './src/ui/circle-fx.js';
const q = new URLSearchParams(location.search);
const key = q.get('key'), orient = q.get('orient');
const [W, H] = CIRCLE_SIZE[orient];
const stage = document.getElementById('stage');
stage.style.width = `${W}px`; stage.style.height = `${H}px`;
const paint = document.getElementById('paint');
paint.src = `art/${orient === 'land' ? 'boards-v2' : 'boards-portrait'}/${key}.jpg`;
await paint.decode();
const n = /^circle(\d)$/.exec(key);
window.fx = await startBoardFx(document.getElementById('host'), n ? Number(n[1]) : key, orient, { only: (q.get('only') ?? 'echo,crawlers,warp').split(',') });
// The painting and the fx canvas composited, as RGBA bytes.
const comp = document.createElement('canvas'); comp.width = W; comp.height = H;
const g = comp.getContext('2d', { willReadFrequently: true });
g.drawImage(paint, 0, 0, W, H);
const base = g.getImageData(0, 0, W, H).data;
const union = new Uint8Array(W * H);
window.sample = () => {
  g.drawImage(paint, 0, 0, W, H); g.drawImage(window.fx.canvas, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data;
  let n = 0;
  for (let i = 0; i < W * H; i++) {
    const k = i * 4;
    if (Math.abs(d[k] - base[k]) + Math.abs(d[k + 1] - base[k + 1]) + Math.abs(d[k + 2] - base[k + 2]) > 6) { if (!union[i]) n++; union[i] = 1; }
  }
  return n;
};
window.unionPng = () => {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); const im = x.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = union[i] * 255; im.data[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0); return c.toDataURL('image/png');
};
window.frame = () => { g.drawImage(paint, 0, 0, W, H); g.drawImage(window.fx.canvas, 0, 0, W, H); return comp.toDataURL('image/png'); };
window.ready = true;
</script>
