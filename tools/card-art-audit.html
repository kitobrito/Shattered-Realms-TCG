<!DOCTYPE html>
<!-- Card art audit: every card in the game, drawn with its real frame.
     ?mode=gap  replaces the art with solid magenta over a lime card, so any lime showing inside a
                frame's picture window is a gap the art doesn't cover (tools/card-art-audit.mjs counts it).
     Open from the repo root, e.g. python3 -m http.server, then /tools/card-art-audit.html -->
<html><head><meta charset="utf-8"><base href="/">
<link rel="stylesheet" href="src/ui/style.css">
<style>
  body { margin: 0; background: #fff; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .zoom-foil { display: none !important; }
  #grid { display: grid; grid-template-columns: repeat(10, 240px); gap: 14px; padding: 14px; }
  .cell { width: 240px; height: 338px; position: relative; }
  .cell .big-card { --h: 333px; }
  body.gap .big-card, body.gap .bc-art { background: #00ff00 !important; }
  body.gap .bc-art img { content: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22%3E%3Crect width=%2210%22 height=%2210%22 fill=%22%23ff00ff%22/%3E%3C/svg%3E'); }
  body.gap .bc-art span { background: #ff00ff; color: transparent; }
  body.gap .zoom-foil, body.gap .sh-accent, body.gap .big-card::before, body.gap .big-card::after { display: none !important; }
</style></head>
<body><div id="grid"></div>
<script type="module">
  import '../src/cards/index.js';
  import { allCards } from '../src/engine/registry.js';
  import { bigCardHTML } from '../src/ui/shared.js';
  const params = new URLSearchParams(location.search);
  if (params.get('mode') === 'gap') document.body.classList.add('gap');
  const only = params.get('only');
  const from = Number(params.get('from') || 0), count = Number(params.get('count') || 100000);
  const all = allCards().filter((c) => !c.custom && (!only || c.id === only || c.faction === only));
  window.__total = all.length;
  const cards = all.slice(from, from + count);
  const grid = document.getElementById('grid');
  grid.innerHTML = cards.map((c) => `<div class="cell" data-id="${c.id}">${bigCardHTML(c)}</div>`).join('');
  window.__cards = cards.length;
  window.__ready = Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
</script></body></html>
