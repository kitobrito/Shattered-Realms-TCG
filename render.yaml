# Render Blueprint for the Shattered Realms server (accounts, Quick Match, Ranked).
# In Render: New + → Blueprint → pick this repository. See server/README.md.
#
# An always-on server (Starter: no sleeping) and Render's own Postgres for accounts and ranks,
# connected over Render's private network. Plans can be changed later in the Render dashboard.
services:
  - type: web
    name: shattered-realms
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: shattered-realms-db
          property: connectionString

databases:
  - name: shattered-realms-db
    plan: basic-256mb
    databaseName: shattered_realms
    ipAllowList: []   # only the server (on Render's private network) can reach it
